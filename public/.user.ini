; Session cookie hardening (Extol / PayTrack)
; Read by PHP before any page runs, so it covers every session_start() call.
; Requires PHP-FPM or CGI on the host (Hostinger supports this).

; JavaScript cannot read the session cookie
session.cookie_httponly = 1

; Cookie is only sent over HTTPS (the site forces HTTPS)
session.cookie_secure = 1

; Blocks cross-site request forgery via the session cookie
session.cookie_samesite = "Lax"

; Rejects session IDs the server did not issue
session.use_strict_mode = 1

; Session ID only travels in cookies, never in URLs
session.use_only_cookies = 1
session.use_trans_sid = 0
